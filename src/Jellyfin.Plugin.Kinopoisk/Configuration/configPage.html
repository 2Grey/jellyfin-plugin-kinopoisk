<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>КиноПоиск</title>
</head>
<body>
    <div id="KinopoiskConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="KinopoiskConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="PoiskKinoApiToken">API-ключ PoiskKino</label>
                        <input id="PoiskKinoApiToken" name="PoiskKinoApiToken" type="password" is="emby-input" autocomplete="off" />
                        <div class="fieldDescription">Получите личный API-ключ в <a href="https://t.me/poiskkinodev_bot">боте PoiskKino</a> и вставьте его в поле выше.
                            Ключ прежнего API не подходит. <a href="https://api.poiskkino.dev/documentation">Документация</a>.
                        </div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Сохранить</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var KinopoiskPluginConfig = {
                pluginUniqueId: '33e6d249-648f-44cd-a9ce-497be06c08df'
            };

            document.querySelector('#KinopoiskConfigPage').addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(KinopoiskPluginConfig.pluginUniqueId).then(function (config) {
                    document.querySelector('#PoiskKinoApiToken').value = config.PoiskKinoApiToken || "";
                    Dashboard.hideLoadingMsg();
                });
            });

            document.querySelector('#KinopoiskConfigForm').addEventListener('submit', function (event) {
                event.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(KinopoiskPluginConfig.pluginUniqueId).then(function (config) {
                    config.PoiskKinoApiToken = document.querySelector('#PoiskKinoApiToken').value;
                    ApiClient.updatePluginConfiguration(KinopoiskPluginConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
                return false;
            });
        </script>
    </div>
</body>
</html>
