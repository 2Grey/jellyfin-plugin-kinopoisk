name: Release

on:
  workflow_dispatch:

concurrency:
  group: plugin-release
  cancel-in-progress: false

env:
  DIST_ARCHIVES_PATH: dist/kinopoisk
  MANIFEST_FILE: dist/manifest.json
  TARGET_ABI: 12.4.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Verify release version
      run: |
        if [[ "$GITHUB_REF_TYPE" != branch ]]; then
          echo "::error::Запустите выпуск из ветки, чтобы сохранить в неё манифест."
          exit 1
        fi

        VERSION=$(sed -nE '/^## \[Unreleased\]/d; s/^## \[v?([^]]+)\].*/\1/p' CHANGELOG.md | sed -n '1p')
        if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
          echo "::error::Укажите новую версию из четырёх чисел в CHANGELOG.md."
          exit 1
        fi

        if ! jq -e --arg version "$VERSION" 'all(.[0].versions[]; .version != $version)' "$MANIFEST_FILE" > /dev/null; then
          echo "::error::Версия $VERSION уже есть в манифесте или манифест не читается."
          exit 1
        fi

        TAG_STATUS=0
        git ls-remote --exit-code --refs origin "refs/tags/v${VERSION}" > /dev/null || TAG_STATUS=$?
        case "$TAG_STATUS" in
          0) echo "::error::Тег v${VERSION} уже существует."; exit 1 ;;
          2) ;;
          *) echo "::error::Не удалось проверить теги в origin."; exit "$TAG_STATUS" ;;
        esac

        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build project
      run: dotnet build --configuration Release --property:Version="$VERSION" ./src

    - name: Test project
      run: dotnet test --configuration Release --no-build ./src

    - name: Package release archive
      run: |
        RELEASE_FILENAME=jellyfin-plugin-kinopoisk_${VERSION}.zip
        RELEASE_FILE=${DIST_ARCHIVES_PATH}/${RELEASE_FILENAME}
        mkdir -p "$DIST_ARCHIVES_PATH"
        rm -f "$RELEASE_FILE"
        zip --junk-paths "$RELEASE_FILE" \
          ./src/Jellyfin.Plugin.Kinopoisk/bin/Release/net10.0/Jellyfin.Plugin.Kinopoisk.dll \
          ./src/PoiskKino.ApiClient/bin/Release/net10.0/PoiskKino.ApiClient.dll
        echo "RELEASE_FILE=$RELEASE_FILE" >> "$GITHUB_ENV"

    - name: Prepare manifest
      run: |
        NOTES_FILE="$RUNNER_TEMP/kinopoisk-release-notes.md"
        awk -v version="$VERSION" '
          /^## \[/ {
            if (section) exit
            section = index($0, "## [" version "]") == 1 || index($0, "## [v" version "]") == 1
            next
          }
          section { print }
        ' CHANGELOG.md > "$NOTES_FILE"
        CHANGELOG=$(<"$NOTES_FILE")
        if [[ -z "${CHANGELOG//[[:space:]]/}" ]]; then
          CHANGELOG="New release"
        fi
        printf '%s' "$CHANGELOG" > "$NOTES_FILE"
        HASH=$(md5sum "$RELEASE_FILE" | cut -d' ' -f1)
        SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/${RELEASE_FILE##*/}"

        jq --arg version "$VERSION" \
           --arg hash "$HASH" \
           --rawfile changelog "$NOTES_FILE" \
           --arg abi "$TARGET_ABI" \
           --arg timestamp "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
           --arg url "$SOURCE_URL" \
           '.[0].versions |= ([{
             version: $version, checksum: $hash, changelog: $changelog,
             targetAbi: $abi, sourceUrl: $url, timestamp: $timestamp
           }] + .)' "$MANIFEST_FILE" > "${MANIFEST_FILE}.tmp"
        mv "${MANIFEST_FILE}.tmp" "$MANIFEST_FILE"
        echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

    - name: Publish release and push manifest
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        REMOTE_SHA=$(git ls-remote --exit-code --refs origin "$GITHUB_REF" | cut -f1)
        if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
          echo "::error::Ветка изменилась после запуска. Запустите выпуск заново с её актуального коммита."
          exit 1
        fi

        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add "$MANIFEST_FILE"
        git commit -m "Added to manifest version $VERSION [skip ci]"

        gh release create "v$VERSION" "$RELEASE_FILE" --target "$GITHUB_SHA" --notes-file "$NOTES_FILE"
        git push origin "HEAD:$GITHUB_REF"
